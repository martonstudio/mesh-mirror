<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesh Mirror</title>
<style>
  html, body { height: 100%; margin: 0; background: #04050a; overflow: hidden; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  video { display: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="cam" playsinline muted autoplay></video>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
} }
</script>

<script type="module">
import * as THREE from "three";
import { FaceLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";

const MAX_FACES = 2;
const EMIT_MAX = 10000;
const LINE_COLOR = new THREE.Color("#9be7ff");
const VIOLET = new THREE.Color("#b28cff");
const TUNNEL_COLOR = new THREE.Color("#ff7a1a");
const TUN_L = new THREE.Color("#b01030"), TUN_R = new THREE.Color("#ffd23a");   // face left = deep red, face right = hot yellow   // warm orange against the cyan/violet mesh
const FOV = 50;
const CAM_Z = 1 / Math.tan(THREE.MathUtils.degToRad(FOV / 2));   // z=0 plane spans y in [-1,1]

const video = document.getElementById("cam");

/* ---------- renderer / camera ---------- */
const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance", preserveDrawingBuffer: true });
renderer.autoClear = false;   // previous frame stays and is faded each frame, which leaves trails
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x04050a, 1);
const scene = new THREE.Scene();
const fadeScene = new THREE.Scene(), fadeCam = new THREE.Camera();
const fadeMat = new THREE.ShaderMaterial({
  uniforms: { uFade: { value: 0.16 } },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `uniform float uFade; void main(){ gl_FragColor = vec4(.016, .02, .04, uFade); }`,
  transparent: true, depthTest: false, depthWrite: false,
});
const fadeQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fadeMat);
fadeQuad.frustumCulled = false;
fadeScene.add(fadeQuad);
let aspect = 1;
const cam = new THREE.PerspectiveCamera(FOV, 1, 0.05, 200);
cam.position.z = CAM_Z;

/* ---------- video plane (dim mirrored feed, optional) ---------- */
const vidTex = new THREE.VideoTexture(video);
vidTex.colorSpace = THREE.SRGBColorSpace;
const vidMat = new THREE.ShaderMaterial({
  uniforms: { map: { value: vidTex }, amt: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D map; uniform float amt; varying vec2 vUv;
    void main(){ vec3 c = texture2D(map, vec2(1.0 - vUv.x, vUv.y)).rgb; float g = dot(c, vec3(.299,.587,.114));
      gl_FragColor = vec4(mix(vec3(g), c, .25) * vec3(.75,.85,1.) * amt, 1.); }`,
  depthWrite: false,
});
const vidPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), vidMat);
vidPlane.renderOrder = -2;
vidPlane.visible = false;
scene.add(vidPlane);
let showVideo = false;

/* ---------- shared soft-point shader ---------- */
const pointFrag = `varying float vA; varying vec3 vC;
  void main(){ vec2 d = gl_PointCoord - .5; float r = length(d); if (r > .5) discard;
    float a = smoothstep(.5, .0, r); a = a * a * .55 + smoothstep(.14, .0, r);   // soft halo + bright core
    gl_FragColor = vec4(vC * a * vA, 1.); }`;

/* ---------- grid tunnel (pivots at the camera, turns with the head) ---------- */
const TUNNEL_LEN = 36, CELL = 0.5;
const tunnelMat = new THREE.ShaderMaterial({
  uniforms: { uScroll: { value: 0 }, uLen: { value: TUNNEL_LEN }, uColor: { value: TUNNEL_COLOR }, uTime: { value: 0 }, uPump: { value: 1 } },
  vertexShader: `attribute float ring; uniform float uScroll, uLen; varying float vD, vB;
    void main(){ vec3 p = position; vB = ring > 1.5 ? 2.4 : (ring > .5 ? .45 : .8);
      if (ring > .5) p.z = -mod(-p.z - uScroll, uLen);
      vec4 mv = modelViewMatrix * vec4(p, 1.); vD = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 uColor; uniform float uTime, uPump; varying float vD, vB;
    void main(){ float a = exp(-vD * .1) * smoothstep(.3, 1.8, vD);
      a *= .5 + .5 * sin(vD * .9 - uTime * 2.6);            // light pulses running down the tunnel
      gl_FragColor = vec4(uColor * a * 1.5 * uPump * vB, 1.); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});

/* wire boxes and ring pairs that fly past along the tunnel */
const propMat = new THREE.ShaderMaterial({
  uniforms: { uScroll: { value: 0 }, uLen: { value: TUNNEL_LEN }, uTime: { value: 0 } },
  vertexShader: `attribute vec3 center, col, spin; uniform float uScroll, uLen, uTime; varying float vD; varying vec3 vC;
    void main(){ vec3 c = center; c.z = -mod(-c.z - uScroll, uLen);
      float a = uTime * spin.x + spin.z, b = uTime * spin.y + spin.z * 1.7;     // each shape tumbles on its own axes
      vec3 q = position;
      q.xz = mat2(cos(a), -sin(a), sin(a), cos(a)) * q.xz;
      q.yz = mat2(cos(b), -sin(b), sin(b), cos(b)) * q.yz;
      vec4 mv = modelViewMatrix * vec4(c + q, 1.); vD = -mv.z; vC = col; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying float vD; varying vec3 vC;
    void main(){ float a = exp(-vD * .09) * smoothstep(.2, 1.4, vD); gl_FragColor = vec4(vC * a, 1.); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const props = new THREE.LineSegments(new THREE.BufferGeometry(), propMat);
props.frustumCulled = false; props.renderOrder = -1;
/* dust that streams past, so speed is visible */
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uScroll: { value: 0 }, uLen: { value: TUNNEL_LEN }, uPR: { value: renderer.getPixelRatio() } },
  vertexShader: `attribute float seed; uniform float uScroll, uLen, uPR; varying float vA; varying vec3 vC;
    void main(){ vec3 p = position; p.z = -mod(-p.z - uScroll, uLen);
      vec4 mv = modelViewMatrix * vec4(p, 1.); float d = max(.3, -mv.z);
      vA = exp(-d * .08) * smoothstep(.2, 1.2, d) * (.35 + .65 * seed); vC = mix(vec3(1., .8, .5), vec3(.7, .9, 1.), seed);
      gl_Position = projectionMatrix * mv; gl_PointSize = (2. + 4. * seed) * uPR * clamp(2.2 / d, .3, 5.); }`,
  fragmentShader: pointFrag,
  transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
});
const dust = new THREE.Points(new THREE.BufferGeometry(), dustMat);
dust.frustumCulled = false; dust.renderOrder = -1;
const PROP_COLORS = ["#ffb347", "#ffe066", "#ff3d81", "#35e0a1"].map(c => new THREE.Color(c));

/* soft light beams fanning out from the far end */
const beamMat = new THREE.ShaderMaterial({
  vertexShader: `attribute vec4 col; varying vec4 vCol; void main(){ vCol = col; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `varying vec4 vCol; void main(){ gl_FragColor = vec4(vCol.rgb * vCol.a, 1.); }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
});
const beams = (() => {
  const pos = [], col = [], pal = ["#ffd9a0", "#ff9ad5", "#9be7ff", "#fff2b0", "#b28cff", "#8dffd0", "#ffb38a"].map(c => new THREE.Color(c));
  pal.forEach((c, i) => {
    const a = i / pal.length * Math.PI * 2 + Math.random() * 0.5, w = 0.03 + Math.random() * 0.06, R = 5;
    pos.push(0, 0, -TUNNEL_LEN, R * Math.cos(a - w), R * Math.sin(a - w), -0.5, R * Math.cos(a + w), R * Math.sin(a + w), -0.5);
    col.push(c.r, c.g, c.b, 0.5, c.r, c.g, c.b, 0.06, c.r, c.g, c.b, 0.06);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("col", new THREE.Float32BufferAttribute(col, 4));
  const m = new THREE.Mesh(g, beamMat); m.frustumCulled = false; m.renderOrder = -1;
  return m;
})();
const tunnel = new THREE.LineSegments(new THREE.BufferGeometry(), tunnelMat);
tunnel.frustumCulled = false; tunnel.renderOrder = -1;
const tunnelGroup = new THREE.Group();
tunnelGroup.position.z = CAM_Z;
tunnelGroup.add(tunnel, props, dust, beams);
scene.add(tunnelGroup);
let tunnelKey = "";
function buildTunnel(rx, ry) {
  const key = rx.toFixed(2) + "/" + ry.toFixed(2);
  if (key === tunnelKey) return;
  tunnelKey = key;
  const pos = [], ring = [];
  const seg = (ax, ay, az, bx, by, bz, r) => { pos.push(ax, ay, az, bx, by, bz); ring.push(r, r); };
  const nx = Math.max(2, Math.round(2 * rx / CELL)), ny = Math.max(2, Math.round(2 * ry / CELL));
  const Z0 = 0;   // tunnel mouth sits at the camera, which is also the pivot
  for (let i = 0; i <= nx; i++) { const x = -rx + 2 * rx * i / nx; seg(x, -ry, Z0, x, -ry, -TUNNEL_LEN, 0); seg(x, ry, Z0, x, ry, -TUNNEL_LEN, 0); }
  for (let i = 1; i < ny; i++) { const y = -ry + 2 * ry * i / ny; seg(-rx, y, Z0, -rx, y, -TUNNEL_LEN, 0); seg(rx, y, Z0, rx, y, -TUNNEL_LEN, 0); }
  for (let d = 0; d < TUNNEL_LEN; d += CELL) {
    const z = -d, r = Math.round(d / CELL) % 4 === 0 ? 2 : 1;
    seg(-rx, -ry, z, rx, -ry, z, r); seg(rx, -ry, z, rx, ry, z, r); seg(rx, ry, z, -rx, ry, z, r); seg(-rx, ry, z, -rx, -ry, z, r);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("ring", new THREE.Float32BufferAttribute(ring, 1));
  tunnel.geometry.dispose();
  tunnel.geometry = g;

  const pp = [], pc = [], pk = [], ps = [];
  let sp = [0, 0, 0];
  const pseg = (c, k, ax, ay, az, bx, by, bz) => { pp.push(ax, ay, az, bx, by, bz); pc.push(c[0], c[1], c[2], c[0], c[1], c[2]); pk.push(k.r, k.g, k.b, k.r, k.g, k.b); ps.push(sp[0], sp[1], sp[2], sp[0], sp[1], sp[2]); };
  for (let n = 0; n < 44; n++) {
    sp = [(Math.random() - 0.5) * 2.6, (Math.random() - 0.5) * 1.8, Math.random() * 6.28];
    const k = PROP_COLORS[n % PROP_COLORS.length], d = -Math.random() * TUNNEL_LEN;
    if (n % 3) {   // wire box hugging a wall
      const w = 0.15 + Math.random() * 0.35, h = 0.15 + Math.random() * 0.5, dp = 0.2 + Math.random() * 0.8;
      const onSide = Math.random() < 0.5, sgn = Math.random() < 0.5 ? -1 : 1;
      const c = onSide ? [sgn * (rx - w), (Math.random() * 2 - 1) * (ry - h), d] : [(Math.random() * 2 - 1) * (rx - w), sgn * (ry - h), d];
      for (const a of [-1, 1]) for (const b of [-1, 1]) {
        pseg(c, k, -w, a * h, b * dp, w, a * h, b * dp); pseg(c, k, a * w, -h, b * dp, a * w, h, b * dp); pseg(c, k, a * w, b * h, -dp, a * w, b * h, dp);
      }
    } else {       // pair of concentric rings, kept away from the middle where the face is
      const ang = Math.random() * Math.PI * 2, c = [Math.cos(ang) * rx * 0.72, Math.sin(ang) * ry * 0.72, d], r = 0.12 + Math.random() * 0.3, N = 36;
      for (const rr of [r, r * 0.7]) for (let i = 0; i < N; i++) {
        const a0 = i / N * Math.PI * 2, a1 = (i + 1) / N * Math.PI * 2;
        pseg(c, k, rr * Math.cos(a0), rr * Math.sin(a0), 0, rr * Math.cos(a1), rr * Math.sin(a1), 0);
      }
    }
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute("position", new THREE.Float32BufferAttribute(pp, 3));
  pg.setAttribute("center", new THREE.Float32BufferAttribute(pc, 3));
  pg.setAttribute("col", new THREE.Float32BufferAttribute(pk, 3));
  pg.setAttribute("spin", new THREE.Float32BufferAttribute(ps, 3));
  props.geometry.dispose();
  props.geometry = pg;

  const DN = 1400, dp = new Float32Array(DN * 3), ds = new Float32Array(DN);
  for (let i = 0; i < DN; i++) { dp[i * 3] = (Math.random() * 2 - 1) * rx; dp[i * 3 + 1] = (Math.random() * 2 - 1) * ry; dp[i * 3 + 2] = -Math.random() * TUNNEL_LEN; ds[i] = Math.random(); }
  const dg = new THREE.BufferGeometry();
  dg.setAttribute("position", new THREE.BufferAttribute(dp, 3));
  dg.setAttribute("seed", new THREE.BufferAttribute(ds, 1));
  dust.geometry.dispose();
  dust.geometry = dg;
}

/* ---------- emitted particles (CPU ring buffer) ---------- */
const ePos = new Float32Array(EMIT_MAX * 3);
const eVel = new Float32Array(EMIT_MAX * 3);
const eLife = new Float32Array(EMIT_MAX);
const eMax = new Float32Array(EMIT_MAX).fill(1);
const eSize = new Float32Array(EMIT_MAX);
const eHue = new Float32Array(EMIT_MAX);
let eHead = 0;
const emGeo = new THREE.BufferGeometry();
emGeo.setAttribute("position", new THREE.BufferAttribute(ePos, 3).setUsage(THREE.DynamicDrawUsage));
emGeo.setAttribute("life", new THREE.BufferAttribute(eLife, 1).setUsage(THREE.DynamicDrawUsage));
emGeo.setAttribute("size", new THREE.BufferAttribute(eSize, 1));
emGeo.setAttribute("hue", new THREE.BufferAttribute(eHue, 1));
const emMat = new THREE.ShaderMaterial({
  uniforms: { uPR: { value: renderer.getPixelRatio() }, uCamZ: { value: CAM_Z }, uC1: { value: LINE_COLOR }, uC2: { value: VIOLET }, uC3: { value: new THREE.Color("#ff3d81") } },
  vertexShader: `attribute float life, size, hue; uniform float uPR, uCamZ; uniform vec3 uC1, uC2, uC3; varying float vA; varying vec3 vC;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.); float d = max(.25, -mv.z);
      float fade = smoothstep(1., .9, life) * smoothstep(0., .35, life);
      vA = fade * exp(-max(0., d - uCamZ) * .12); vC = (hue > .82 ? uC3 : mix(uC1, uC2, hue / .82)) * 1.6;
      gl_Position = projectionMatrix * mv;
      gl_PointSize = size * uPR * clamp(uCamZ / d, .2, 4.); }`,
  fragmentShader: pointFrag,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const emPoints = new THREE.Points(emGeo, emMat);
emPoints.frustumCulled = false;
scene.add(emPoints);

/* ---------- face meshes ---------- */
const TESS = FaceLandmarker.FACE_LANDMARKS_TESSELATION;
const OVAL = FaceLandmarker.FACE_LANDMARKS_FACE_OVAL;
const FEATURES = [
  ...FaceLandmarker.FACE_LANDMARKS_LEFT_EYE, ...FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,
  ...FaceLandmarker.FACE_LANDMARKS_LIPS, ...FaceLandmarker.FACE_LANDMARKS_LEFT_EYEBROW,
  ...FaceLandmarker.FACE_LANDMARKS_RIGHT_EYEBROW, ...OVAL,
];
const OVAL_IDX = [...new Set(OVAL.map(e => e.start))];
const N_LM = 478;

// animated glow behind the face: a soft spiky halo that breathes with the kick drum
const haloMat = new THREE.ShaderMaterial({
  uniforms: { uI: { value: 0.3 }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv * 2. - 1.; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform float uI, uTime; varying vec2 vUv;
    void main(){ float d = length(vUv), ang = atan(vUv.y, vUv.x);
      float a = pow(max(0., 1. - d), 2.2) * (.7 + .3 * sin(ang * 9. + uTime * 1.3) * sin(ang * 4. - uTime * .7));
      vec3 c = mix(vec3(.3, .8, 1.), vec3(1., .25, .7), .5 + .5 * sin(uTime * .5 + d * 3.));
      gl_FragColor = vec4(c * a * uI, 1.); }`,
  transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
});
const halo = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), haloMat);
halo.frustumCulled = false; halo.visible = false; halo.renderOrder = 2; scene.add(halo);

// triangles recovered from the tessellation edges (every 3-cycle of edges is one face of the mesh)
const TRIS = (() => {
  const adj = Array.from({ length: N_LM }, () => new Set());
  for (const e of TESS) { adj[e.start].add(e.end); adj[e.end].add(e.start); }
  const out = [];
  for (let a = 0; a < N_LM; a++) for (const b of adj[a]) if (b > a) for (const c of adj[b]) if (c > b && adj[a].has(c)) out.push(a, b, c);
  return out;
})();
// semi-transparent faceted face: each triangle is flat-shaded from a light that moves with the phone / head
const uLight = { value: new THREE.Vector3(0.2, 0.4, 1).normalize() };
const polyShader = {
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform vec3 uLight; varying vec3 vP;
    void main(){
      vec3 n = normalize(cross(dFdx(vP), dFdy(vP))); if (n.z < 0.) n = -n;     // one normal per triangle = faceted look
      float diff = max(dot(n, uLight), 0.);
      float spec = pow(max(dot(n, normalize(uLight + vec3(0., 0., 1.))), 0.), 24.);
      float rim = pow(1. - n.z, 2.);
      vec3 col = mix(vec3(.10, .04, .28), vec3(.42, .82, 1.), diff) + spec * vec3(1., .78, .5) + rim * vec3(.7, .25, .9) * .6;
      float a = clamp(.14 + .32 * diff + .6 * spec + .3 * rim, 0., .8);
      gl_FragColor = vec4(col, a); }`,
};
const faces = [];
for (let f = 0; f < MAX_FACES; f++) {
  const pos = new Float32Array(N_LM * 3);
  const posAttr = new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage);
  const sg = new THREE.BufferGeometry();
  sg.setAttribute("position", posAttr);
  sg.setIndex(TRIS);
  const mesh = new THREE.Mesh(sg, new THREE.ShaderMaterial({ uniforms: { uLight }, ...polyShader, side: THREE.DoubleSide, transparent: true, depthWrite: false, depthTest: false }));
  mesh.frustumCulled = false; mesh.visible = false; mesh.renderOrder = 3; scene.add(mesh);
  const mkLines = (edges, color, opacity, order) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", posAttr);
    const idx = [];
    for (const e of edges) idx.push(e.start, e.end);
    g.setIndex(idx);
    const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false }));
    l.frustumCulled = false; l.visible = false; l.renderOrder = order; scene.add(l);
    return l;
  };
  const edges = mkLines(TESS, LINE_COLOR, 0.22, 4);
  const feat = mkLines(FEATURES, new THREE.Color("#ffffff"), 0.9, 5);
  faces.push({ pos, posAttr, mesh, edges, feat });
}

/* ---------- layout ---------- */
let W = 2, H = 2;   // world size of the video "cover" rect
function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  aspect = w / h;
  cam.aspect = aspect;
  cam.updateProjectionMatrix();
  buildTunnel(1.25 * Math.max(aspect, 0.6), 1.25);
  const va = video.videoWidth && video.videoHeight ? video.videoWidth / video.videoHeight : 16 / 9;
  if (aspect > va) { W = 2 * aspect; H = W / va; } else { H = 2; W = H * va; }
  vidPlane.scale.set(W, H, 1);
}
window.addEventListener("resize", layout);
layout();

/* ---------- face tracker ---------- */
let landmarker = null;
async function loadTracker() {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = (delegate) => ({
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate,
    },
    runningMode: "VIDEO", numFaces: MAX_FACES, outputFaceBlendshapes: false,
  });
  try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch (e) { console.warn("GPU delegate failed, using CPU", e); landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
}
loadTracker().catch(e => console.error(e));

/* ---------- motion sensor: turning the phone turns the tunnel and moves the light ---------- */
let sensorOn = false;
const devQ = new THREE.Quaternion(), baseQ = new THREE.Quaternion(), relQ = new THREE.Quaternion(), targetQ = new THREE.Quaternion();
const _e = new THREE.Euler(), _zee = new THREE.Vector3(0, 0, 1), _q0 = new THREE.Quaternion(), _id = new THREE.Quaternion();
const _q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
const lightDir = new THREE.Vector3();
window.addEventListener("deviceorientation", (ev) => {
  if (ev.alpha == null || ev.beta == null || ev.gamma == null) return;   // laptops fire this with no data
  const d = Math.PI / 180, orient = (screen.orientation?.angle ?? window.orientation ?? 0) * d;
  _e.set(ev.beta * d, ev.alpha * d, -ev.gamma * d, "YXZ");
  devQ.setFromEuler(_e).multiply(_q1).multiply(_q0.setFromAxisAngle(_zee, -orient));
  if (!sensorOn) { baseQ.copy(devQ); sensorOn = true; }
});

let camOn = false, camBusy = false;
async function startCamera() {
  if (camOn || camBusy || !navigator.mediaDevices?.getUserMedia) return;
  camBusy = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false });
    video.srcObject = stream;
    await video.play();
    camOn = true; layout();
    initAudio();
  } catch (e) { console.error(e); }
  camBusy = false;
}
startCamera();   // the browser's own permission prompt appears as soon as the page opens

// A tap anywhere retries the camera if it was blocked, and unlocks the motion sensor on iPhone (it may only be asked for from a tap).
window.addEventListener("pointerdown", () => {
  startCamera(); initAudio();
  if (!sensorOn && typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {});
});
function toggleFS() { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.())?.catch?.(() => {}); }
window.addEventListener("keydown", (e) => {
  initAudio();
  if (e.key === "v" || e.key === "V") showVideo = !showVideo;
  else if (e.key === "f" || e.key === "F") toggleFS();
});

/* ---------- audio: ethereal minimal techno at 125 bpm, everything synthesised in the browser ---------- */
const BPM = 125, S16 = 60 / BPM / 4;   // S16 = one sixteenth note in seconds
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [[57, 60, 64, 71], [53, 57, 60, 64], [52, 55, 59, 62], [55, 59, 62, 69]];
// acid line, 16 steps: [semitones above A1 or null for a rest, accent, slide into the next note]
const ACID = [[0, 1, 0], [null], [12, 0, 0], [0, 0, 1], [3, 0, 0], [null], [10, 1, 1], [12, 0, 0],
              [0, 0, 0], [0, 1, 0], [null], [7, 0, 1], [12, 1, 0], [3, 0, 0], [null], [10, 0, 0]];

function buildAudio(ctx) {
  const A = { ctx };
  const out = ctx.createDynamicsCompressor(); out.threshold.value = -14; out.ratio.value = 6; out.connect(ctx.destination);
  A.master = ctx.createGain(); A.master.gain.value = 0.7; A.master.connect(out);
  // main filter: drums, pad and reverb all pass through it (face distance opens and closes it)
  A.mainLP = ctx.createBiquadFilter(); A.mainLP.type = "lowpass"; A.mainLP.Q.value = 1.4; A.mainLP.frequency.value = 2000;
  A.mainLP2 = ctx.createBiquadFilter(); A.mainLP2.type = "lowpass"; A.mainLP2.Q.value = 0.7; A.mainLP2.frequency.value = 2000;   // second stage = steeper cut
  A.mainG = ctx.createGain(); A.mainG.gain.value = 0.7;
  A.mainLP.connect(A.mainLP2).connect(A.mainG).connect(A.master);
  A.kicks = []; A.acid = 0.5; A.acidVol = 1;
  const len = Math.floor(ctx.sampleRate * 3.2), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
  A.rev = ctx.createConvolver(); A.rev.buffer = ir;
  const revG = ctx.createGain(); revG.gain.value = 0.5; A.rev.connect(revG).connect(A.mainLP);
  A.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  { const d = A.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  // pad: four notes, two detuned saws each, slow filter drift, mostly reverb
  const padLP = ctx.createBiquadFilter(); padLP.type = "lowpass"; padLP.frequency.value = 1300; padLP.Q.value = 0.7;
  const padG = ctx.createGain(); padG.gain.value = 0.03; padLP.connect(padG); padG.connect(A.mainLP); padG.connect(A.rev);
  const lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = 0.07; lfoG.gain.value = 500; lfo.connect(lfoG).connect(padLP.frequency); lfo.start();
  A.pad = [];
  for (let v = 0; v < 4; v++) for (const det of [-8, 8]) {
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.detune.value = det; o.frequency.value = mtof(CHORDS[0][v]); o.connect(padLP); o.start(); A.pad.push(o);
  }
  // acid: saw -> resonant lowpass (left/right position sets its cutoff, each note kicks it open via detune) -> soft clip -> echo
  A.acidOsc = ctx.createOscillator(); A.acidOsc.type = "sawtooth"; A.acidOsc.frequency.value = 55;
  A.acidF = ctx.createBiquadFilter(); A.acidF.type = "lowpass"; A.acidF.Q.value = 15; A.acidF.frequency.value = 600;
  const shaper = ctx.createWaveShaper(), curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) curve[i] = Math.tanh((i / 511.5 - 1) * 2.2);
  shaper.curve = curve;
  A.acidG = ctx.createGain(); A.acidG.gain.value = 0;
  A.acidF2 = ctx.createBiquadFilter(); A.acidF2.type = "lowpass"; A.acidF2.Q.value = 0.7; A.acidF2.frequency.value = 900;
  A.acidOsc.connect(A.acidF).connect(A.acidF2).connect(shaper).connect(A.acidG); A.acidG.connect(A.master);
  const dl = ctx.createDelay(1), fb = ctx.createGain(), wet = ctx.createGain();
  dl.delayTime.value = S16 * 3; fb.gain.value = 0.35; wet.gain.value = 0.3;
  A.acidG.connect(dl); dl.connect(fb).connect(dl); dl.connect(wet).connect(A.master);
  A.acidOsc.start();
  return A;
}

function noiseHit(A, t, type, freq, vol, dec, toRev) {
  const ctx = A.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = A.noise; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dec);
  src.connect(f).connect(g); g.connect(A.mainLP); if (toRev) g.connect(A.rev);
  src.start(t, Math.random() * 0.5, dec + 0.05);
}

// one sixteenth-note step of the track, scheduled at audio time t
function tick(A, step, t) {
  const ctx = A.ctx, s = step % 16, bar = Math.floor(step / 16);
  if (s % 4 === 0) {                                         // kick, four on the floor
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    o.connect(g).connect(A.mainLP); o.start(t); o.stop(t + 0.4);
    A.kicks.push(t); if (A.kicks.length > 8) A.kicks.shift();
  }
  if (s % 4 === 2) noiseHit(A, t, "highpass", 7000, 0.11, 0.09, false);          // off-beat hat
  else if (Math.random() < 0.6) noiseHit(A, t, "highpass", 9000, 0.02 + Math.random() * 0.02, 0.03, false);
  if (s === 4 || s === 12) noiseHit(A, t, "bandpass", 1700, 0.16, 0.14, true);   // soft clap into the reverb
  if (s === 0 && bar % 2 === 0) {                                                // pad glides to the next chord
    const ch = CHORDS[(bar / 2) % CHORDS.length];
    A.pad.forEach((o, i) => o.frequency.setTargetAtTime(mtof(ch[i >> 1]), t, 0.5));
  }
  if (s % 8 === 6 && Math.random() < 0.6) {                                      // occasional high bell
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = mtof([81, 84, 88, 93][(Math.random() * 4) | 0]);
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0005, t + 1.5);
    o.connect(g); g.connect(A.rev); g.connect(A.mainLP); o.start(t); o.stop(t + 1.6);
  }
  if (bar >= 1) {                                                                // acid line joins after one bar
    const [n, acc, slide] = ACID[s], prev = ACID[(s + 15) % 16];
    if (n != null) {
      const f = mtof(33 + n);
      if (prev[2] && prev[0] != null) A.acidOsc.frequency.setTargetAtTime(f, t, 0.025); else A.acidOsc.frequency.setValueAtTime(f, t);
      const amt = (acc ? 3400 : 2200) * (0.25 + 0.75 * A.acid);     // the squelch gets bigger as the filter opens
      A.acidG.gain.setTargetAtTime((acc ? 0.42 : 0.3) * A.acidVol, t, 0.004);
      for (const fl of [A.acidF, A.acidF2]) { fl.detune.setValueAtTime(amt, t); fl.detune.setTargetAtTime(0, t + 0.002, acc ? 0.1 : 0.07); }
      if (!slide) A.acidG.gain.setTargetAtTime(0, t + S16 * 0.6, 0.012);
    }
  }
}

// open: 0 = face close (drums and pad filtered out, acid line in front) .. 1 = far (drums and pad fully open, acid line filtered out)
// acid: 0 = face at screen left (acid dull and closed) .. 1 = right (bright, resonant, squelchy); only has room to open while the face is close
function applyAudioCtl(A, open, acid, now = A.ctx.currentTime) {
  const near = Math.min(1, (1 - open) * 1.6);               // 1 while the face is close, falling to 0 as it moves far away
  acid *= near;                                             // far away closes the acid filter whatever the left/right position
  A.acid = acid; A.acidVol = 0.15 + 0.85 * near;
  const f = 70 * Math.pow(230, open);                       // 70 Hz .. 16 kHz
  A.mainLP.frequency.setTargetAtTime(f, now, 0.05); A.mainLP2.frequency.setTargetAtTime(f, now, 0.05);
  A.mainG.gain.setTargetAtTime(0.25 + 0.75 * Math.pow(open, 0.7), now, 0.05);
  const fa = 80 * Math.pow(110, acid);                      // 80 Hz .. 8.8 kHz
  A.acidF.frequency.setTargetAtTime(fa, now, 0.05); A.acidF2.frequency.setTargetAtTime(fa * 1.5, now, 0.05);
  A.acidF.Q.setTargetAtTime(4 + 14 * acid, now, 0.05);
}

let A = null, nextT = 0, step = 0;
let audioOpen = 0.5, audioAcid = 0.5;   // 0 = filter closed, 1 = open; set from the face each frame
// Browsers only let sound start once the camera is live or the page has been tapped/clicked, so this is called from both.
function initAudio() {
  if (A) { if (A.ctx.state !== "running") A.ctx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  A = buildAudio(new AC());
  A.ctx.resume().catch(() => {});
  A.master.gain.setValueAtTime(0, A.ctx.currentTime);
  A.master.gain.linearRampToValueAtTime(0.7, A.ctx.currentTime + 4);
  setInterval(() => {
    if (A.ctx.state !== "running") return;
    const now = A.ctx.currentTime;
    if (nextT < now) nextT = now + 0.05;
    while (nextT < now + 0.15) { tick(A, step++, nextT); nextT += S16; }
  }, 25);
}

/* ---------- loop ---------- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let last = performance.now(), lastVideoTime = -1;
let results = null;
const faceC = new THREE.Vector2(0, 0), faceTarget = new THREE.Vector2(0, 0);   // swirl axis follows the face
const headTarget = new THREE.Vector3(0, 0, 0);                                  // tunnel rotation target (x, y, z)
let emitAcc = 0, flySpeed = 8, flyPos = 0, acidS = 0.5;
const SWIRL = 0.32, TURB = 0.55, DRAG = 0.45;

// Start just inside the face outline and behind the mask, so particles emerge from behind it.
function spawn(F, cx, cy, fw) {
  const i = eHead; eHead = (eHead + 1) % EMIT_MAX;
  const k = OVAL_IDX[(Math.random() * OVAL_IDX.length) | 0] * 3;
  const s = 0.15 + Math.random() * 0.7;
  const x = cx + (F.pos[k] - cx) * s, y = cy + (F.pos[k + 1] - cy) * s;
  let dx = x - cx, dy = y - cy; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
  const out = 0.2 + Math.random() * 0.5, sw = 0.4 + Math.random() * 0.7;
  const j = i * 3;
  ePos[j] = x; ePos[j + 1] = y; ePos[j + 2] = -fw * (0.35 + Math.random() * 0.3);
  eVel[j] = dx * out - dy * sw;
  eVel[j + 1] = dy * out + dx * sw;
  eVel[j + 2] = Math.random() < 0.4 ? Math.random() * 0.5 : -(0.05 + Math.random() * 0.5);
  eMax[i] = 2.5 + Math.random() * 3.5; eLife[i] = 1;
  eSize[i] = 5 + Math.random() * 9; eHue[i] = Math.random();
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  if (camOn && landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    results = landmarker.detectForVideo(video, now);
  }

  let anyFace = false;
  for (let f = 0; f < MAX_FACES; f++) {
    const F = faces[f];
    const lm = results?.faceLandmarks?.[f];
    const on = !!lm;
    F.mesh.visible = F.edges.visible = F.feat.visible = on;
    if (!on) continue;
    let cx = 0, cy = 0;
    for (let i = 0; i < lm.length && i < N_LM; i++) {
      const x = (0.5 - lm[i].x) * W, y = (0.5 - lm[i].y) * H, z = -lm[i].z * W;
      F.pos[i * 3] = x; F.pos[i * 3 + 1] = y; F.pos[i * 3 + 2] = z;
      cx += x; cy += y;
    }
    F.posAttr.needsUpdate = true;
    cx /= lm.length; cy /= lm.length;

    // cheek-to-cheek and forehead-to-chin spans: face size on screen, plus head turn
    const P = F.pos, nose = 3, top = 30, chin = 456;
    let lx = P[702], ly = P[703], rx = P[1362], ry = P[1363];
    if (lx > rx) { [lx, rx] = [rx, lx]; [ly, ry] = [ry, ly]; }
    const fw = Math.hypot(rx - lx, ry - ly) || 1e-3;
    const fh = Math.hypot(P[top] - P[chin], P[top + 1] - P[chin + 1]) || 1e-3;
    if (!anyFace) {
      const yaw = (P[nose] - (lx + rx) / 2) / fw;
      const pitch = (P[nose + 1] - (P[top + 1] + P[chin + 1]) / 2) / fh;
      const cl = THREE.MathUtils.clamp;
      headTarget.set(cl(pitch * 0.9, -0.45, 0.45), cl(-yaw * 0.9, -0.5, 0.5), cl(Math.atan2(ry - ly, rx - lx) * 0.6, -0.5, 0.5));
      faceTarget.set(cx, cy);
      halo.position.set(cx, cy, -fw * 0.3); halo.scale.setScalar(fw * 3.4);
      audioAcid = THREE.MathUtils.clamp(cx / (aspect * 0.6) * 0.5 + 0.5, 0, 1);   // face at screen left = acid filter closed, right = open
    }
    anyFace = true;

    // big face on screen = camera close = few particles; small face = far = many
    const size = Math.max(fw, fh * 0.72) / Math.min(W, H);
    const far = Math.min(1, Math.max(0, (0.62 - size) / 0.42));
    F.far = (F.far ?? far) + (far - (F.far ?? far)) * Math.min(1, dt * 4);
    if (f === 0) audioOpen = F.far;                                       // close = main filter closed, far = open
    if (!reduceMotion) {
      emitAcc += (260 + 2100 * F.far * F.far) * dt;
      const n = Math.floor(emitAcc); emitAcc -= n;
      for (let k = 0; k < n; k++) spawn(F, cx, cy, fw);
    }
  }
  if (!anyFace) headTarget.set(0, 0, 0);

  faceC.lerp(faceTarget, Math.min(1, dt * 6));
  if (sensorOn) {
    baseQ.slerp(devQ, Math.min(1, dt * 0.25));            // slowly re-centre, so a new resting pose becomes "straight ahead"
    relQ.copy(baseQ).invert().multiply(devQ);             // how far the phone has turned from rest
    if (relQ.w < 0) relQ.set(-relQ.x, -relQ.y, -relQ.z, -relQ.w);
    const ang = 2 * Math.acos(Math.min(1, relQ.w));
    if (ang > 0.6) relQ.slerpQuaternions(_id, relQ, 0.6 / ang);
    targetQ.copy(relQ).invert();                          // world stays put while the phone turns
  } else {
    targetQ.setFromEuler(_e.set(headTarget.x, headTarget.y, headTarget.z, "XYZ"));
  }
  tunnelGroup.quaternion.slerp(targetQ, Math.min(1, dt * (sensorOn ? 12 : 5)));
  lightDir.set(0, 0, -1).applyQuaternion(tunnelGroup.quaternion);       // light sits toward the tunnel's far end, exaggerated
  uLight.value.set(lightDir.x * 3 + 0.15, lightDir.y * 3 + 0.35, 1).normalize();
  // kick drum envelope (1 on the beat, fading), read from the audio clock; silent fallback follows the same tempo
  let kick = Math.exp(-((t * BPM / 60) % 1) * 4);
  if (A && A.ctx.state === "running") {
    const now = A.ctx.currentTime; let lastK = -1;
    for (const k of A.kicks) if (k <= now && k > lastK) lastK = k;
    kick = lastK >= 0 ? Math.exp(-(now - lastK) * 7) : 0;
  }
  // flying: face close = fast, far = slow
  flySpeed += ((anyFace ? 8 + 5 * Math.pow(1 - audioOpen, 1.5) : 8) - flySpeed) * Math.min(1, dt * 3);
  acidS += (audioAcid - acidS) * Math.min(1, dt * 6);
  TUNNEL_COLOR.lerpColors(TUN_L, TUN_R, acidS);
  halo.visible = anyFace;
  haloMat.uniforms.uI.value = 0.22 + 0.55 * kick;
  if (!reduceMotion) {
    flyPos += flySpeed * dt;
    tunnelMat.uniforms.uScroll.value = flyPos % (CELL * 4);
    tunnelMat.uniforms.uTime.value = t;
    tunnelMat.uniforms.uPump.value = 0.75 + 0.9 * kick;
    propMat.uniforms.uScroll.value = dustMat.uniforms.uScroll.value = flyPos % TUNNEL_LEN;
    propMat.uniforms.uTime.value = haloMat.uniforms.uTime.value = t;
    beams.rotation.z = t * 0.12;
  }

  if (A) applyAudioCtl(A, audioOpen, audioAcid);

  // particle physics: swirl around the face axis + per-particle turbulence, in 3D
  const drag = 1 - DRAG * dt;
  for (let i = 0; i < EMIT_MAX; i++) {
    if (eLife[i] <= 0) continue;
    eLife[i] -= dt / eMax[i];
    const j = i * 3, ph = eHue[i] * 6.283;
    const x = ePos[j] - faceC.x, y = ePos[j + 1] - faceC.y, z = ePos[j + 2];
    const r2 = x * x + y * y + 0.15;
    const ax = -y / r2 * SWIRL + TURB * (Math.sin(y * 2.3 + t * 0.7 + ph) + Math.sin(z * 3.1 - t * 0.5 + ph * 1.7));
    const ay = x / r2 * SWIRL + TURB * (Math.sin(z * 2.1 + t * 0.6 + ph) + Math.sin(x * 2.9 + t * 0.4 + ph * 2.3));
    const az = TURB * (Math.sin(x * 2.5 - t * 0.8 + ph) + Math.sin(y * 1.9 + t * 0.3 + ph * 1.3));
    eVel[j] = (eVel[j] + ax * dt) * drag; eVel[j + 1] = (eVel[j + 1] + ay * dt) * drag; eVel[j + 2] = (eVel[j + 2] + az * dt) * drag;
    ePos[j] += eVel[j] * dt; ePos[j + 1] += eVel[j + 1] * dt; ePos[j + 2] += eVel[j + 2] * dt;
    if (ePos[j + 2] > CAM_Z - 0.4) eLife[i] = 0;
  }
  emGeo.attributes.position.needsUpdate = true;
  emGeo.attributes.life.needsUpdate = true;
  emGeo.attributes.size.needsUpdate = true;
  emGeo.attributes.hue.needsUpdate = true;

  const va = vidMat.uniforms.amt;
  va.value += ((showVideo && camOn ? 0.45 : 0) - va.value) * Math.min(1, dt * 5);
  vidPlane.visible = va.value > 0.01;

  fadeMat.uniforms.uFade.value = reduceMotion || vidPlane.visible ? 1 : 0.16;
  renderer.render(fadeScene, fadeCam);   // dim the previous frame instead of clearing it
  renderer.clearDepth();
  renderer.render(scene, cam);
}
requestAnimationFrame(frame);
</script>
